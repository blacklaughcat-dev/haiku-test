<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>俳句50問 応用テスト</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f7f4;color:#17382f;font-family:system-ui,-apple-system,sans-serif}header{background:#164e40;color:white;padding:24px 16px}main{max-width:760px;margin:auto;padding:18px}h1{margin:0;font-size:26px}header p{margin:8px 0 0}.card{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 2px 12px #1232}.q{font-size:20px;font-weight:bold;line-height:1.6}.opt{display:block;width:100%;text-align:left;background:white;border:2px solid #d6e5dc;border-radius:10px;padding:14px;margin:9px 0;font-size:16px;color:#17382f}.sel{border-color:#15846a;background:#e3f5ed}button{cursor:pointer}.btn{background:#17745e;border:0;border-radius:10px;color:white;padding:13px 18px;font-size:16px;font-weight:bold}.btn:disabled{opacity:.35}.row{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:7px}.num{border:1px solid #b6d3c4;background:white;border-radius:7px;height:40px}.done{background:#ccefdc}.hidden{display:none}.muted{color:#658078}.review{border-top:1px solid #d8e7de;padding:16px 0;line-height:1.6}.good{color:#11734f}.bad{color:#b34435}</style><header><main><h1>俳句 実力テスト 50問</h1><p>小学5年生まで｜英進館レベルの応用｜100点満点</p></main></header><main><div class="card" id="intro"><h2>テストについて</h2><p>音数・季語・名句の鑑賞・表現の工夫。全50問の4択問題です。各2点で自動採点し、全問に解説を表示します。</p><button class="btn" onclick="start()">テストを始める</button></div><div id="exam" class="hidden"><div class="card"><b id="count"></b><span class="muted" id="progress"></span><div class="q" id="question"></div><div id="opts"></div><div class="row"><button class="btn" id="prev" onclick="move(-1)">前へ</button><button class="btn" id="next" onclick="move(1)">次へ</button></div></div><div class="card"><h3>問題一覧（番号を押して移動）</h3><div class="grid" id="grid"></div><p class="muted">未回答は0点として採点されます。</p><button class="btn" onclick="finish()">採点する</button></div></div><div class="card hidden" id="result"><h2 id="score"></h2><p id="detail"></p><button class="btn" onclick="reset()">最初から解き直す</button><h2>全問の解答・解説</h2><div id="reviews"></div></div></main><script>const Q=[{"q": "俳句の基本の音数は？", "opts": ["5・7・5", "7・5・7", "5・5・7", "7・7・5"], "ans": 0, "exp": "基本は17音です"}, {"q": "「きょう」の音数は？", "opts": ["1", "2", "3", "4"], "ans": 1, "exp": "きょ・うの2音です"}, {"q": "「がっこう」の音数は？", "opts": ["2", "3", "4", "5"], "ans": 2, "exp": "が・っ・こ・うの4音です"}, {"q": "「しんぶん」の音数は？", "opts": ["3", "4", "5", "6"], "ans": 1, "exp": "し・ん・ぶ・んの4音です"}, {"q": "「ちょうちょ」の音数は？", "opts": ["2", "3", "4", "5"], "ans": 1, "exp": "ちょ・う・ちょの3音です"}, {"q": "「こおり」の音数は？", "opts": ["2", "3", "4", "5"], "ans": 1, "exp": "こ・お・りの3音です"}, {"q": "「サッカー」の音数は？", "opts": ["3", "4", "5", "6"], "ans": 1, "exp": "サ・ッ・カ・ーの4音です"}, {"q": "「はるのかぜ」の音数は？", "opts": ["4", "5", "6", "7"], "ans": 1, "exp": "は・る・の・か・ぜの5音です"}, {"q": "「あさひがのぼる」の音数は？", "opts": ["5", "6", "7", "8"], "ans": 2, "exp": "あ・さ・ひ・が・の・ぼ・るの7音です"}, {"q": "「古池や」の音数は？", "opts": ["4", "5", "6", "7"], "ans": 1, "exp": "ふ・る・い・け・やの5音です"}, {"q": "「蛙（かわず）」の季節は？", "opts": ["春", "夏", "秋", "冬"], "ans": 0, "exp": "蛙は春の季語です"}, {"q": "「蝉」の季節は？", "opts": ["春", "夏", "秋", "冬"], "ans": 1, "exp": "蝉は夏の季語です"}, {"q": "「柿」の季節は？", "opts": ["春", "夏", "秋", "冬"], "ans": 2, "exp": "柿は秋の季語です"}, {"q": "「雪」の季節は？", "opts": ["春", "夏", "秋", "冬"], "ans": 3, "exp": "雪は冬の季語です"}, {"q": "「桜」の季節は？", "opts": ["春", "夏", "秋", "冬"], "ans": 0, "exp": "桜は春の季語です"}, {"q": "「紅葉」の季節は？", "opts": ["春", "夏", "秋", "冬"], "ans": 2, "exp": "紅葉は秋の季語です"}, {"q": "「初雪」の季節は？", "opts": ["春", "夏", "秋", "冬"], "ans": 3, "exp": "初雪は冬の季語です"}, {"q": "「入道雲」の季節は？", "opts": ["春", "夏", "秋", "冬"], "ans": 1, "exp": "入道雲は夏の季語です"}, {"q": "「春一番」の季節は？", "opts": ["春", "夏", "秋", "冬"], "ans": 0, "exp": "春一番は春の季語です"}, {"q": "「秋刀魚」の季節は？", "opts": ["春", "夏", "秋", "冬"], "ans": 2, "exp": "秋刀魚は秋の季語です"}, {"q": "冬の季語は？", "opts": ["若葉", "夕立", "木枯らし", "つばめ"], "ans": 2, "exp": "木枯らしは冬の季語です"}, {"q": "夏の季語は？", "opts": ["梅雨", "霜", "雁", "梅の花"], "ans": 0, "exp": "梅雨は夏の季語です"}, {"q": "「月」は伝統的にどの季節の季語？", "opts": ["春", "夏", "秋", "冬"], "ans": 2, "exp": "単独の月は秋の季語です"}, {"q": "「朝顔」は伝統的にどの季節の季語？", "opts": ["春", "夏", "秋", "冬"], "ans": 2, "exp": "朝顔は秋の季語です"}, {"q": "「七夕」は伝統的にどの季節の季語？", "opts": ["春", "夏", "秋", "冬"], "ans": 2, "exp": "旧暦に由来し秋の季語です"}, {"q": "「古池や かわず飛びこむ 水の音」の作者は？", "opts": ["小林一茶", "松尾芭蕉", "正岡子規", "与謝蕪村"], "ans": 1, "exp": "松尾芭蕉の句です"}, {"q": "「古池や」の句で際立つのは？", "opts": ["歓声", "静けさと水音の対比", "雷鳴", "雨音"], "ans": 1, "exp": "静けさの中の水音が印象的です"}, {"q": "「古池や」の「や」の働きは？", "opts": ["季語", "切れ字", "過去形", "助数詞"], "ans": 1, "exp": "切れ字は区切りや余韻を作ります"}, {"q": "「柿くへば 鐘が鳴るなり 法隆寺」の作者は？", "opts": ["松尾芭蕉", "小林一茶", "正岡子規", "与謝蕪村"], "ans": 2, "exp": "正岡子規の句です"}, {"q": "「柿くへば」の句の季語は？", "opts": ["鐘", "法隆寺", "柿", "鳴る"], "ans": 2, "exp": "柿は秋の季語です"}, {"q": "「くへば」を現代語に近づけると？", "opts": ["食べると", "拾うと", "買うと", "投げると"], "ans": 0, "exp": "くへばは食えばの意味です"}, {"q": "「名月を とってくれろと 泣く子かな」の作者は？", "opts": ["小林一茶", "松尾芭蕉", "正岡子規", "与謝蕪村"], "ans": 0, "exp": "小林一茶の句です"}, {"q": "「名月を」の句で子どもが望むことは？", "opts": ["月を隠す", "月を取ってもらう", "月を描く", "月を見失う"], "ans": 1, "exp": "月を取ってほしいとねだっています"}, {"q": "「菜の花や 月は東に 日は西に」の作者は？", "opts": ["松尾芭蕉", "小林一茶", "与謝蕪村", "正岡子規"], "ans": 2, "exp": "与謝蕪村の句です"}, {"q": "「菜の花や」の句の情景は？", "opts": ["夜明け前", "夕暮れ", "真昼", "大雨"], "ans": 1, "exp": "西に太陽、東に月が見える夕暮れです"}, {"q": "「閑さや 岩にしみ入る 蝉の声」の作者は？", "opts": ["松尾芭蕉", "小林一茶", "正岡子規", "与謝蕪村"], "ans": 0, "exp": "松尾芭蕉の句です"}, {"q": "「閑さや」の表現の効果は？", "opts": ["音で静けさを感じさせる", "岩が溶ける", "蝉の数を示す", "冬を示す"], "ans": 0, "exp": "蝉の声を通して深い静けさを描きます"}, {"q": "「五月雨を あつめて早し 最上川」の季語は？", "opts": ["最上川", "早し", "五月雨", "あつめて"], "ans": 2, "exp": "五月雨は夏の季語です"}, {"q": "「五月雨を」の「早し」は何を表す？", "opts": ["歩く速さ", "川の流れ", "雲の動き", "季節の進み"], "ans": 1, "exp": "川の流れの速さです"}, {"q": "代表的な切れ字の組み合わせは？", "opts": ["や・かな・けり", "は・が・を", "から・まで・より", "です・ます・だ"], "ans": 0, "exp": "代表的な切れ字です"}, {"q": "「土がにおう」はどの感覚？", "opts": ["味覚", "嗅覚", "触覚", "聴覚"], "ans": 1, "exp": "においは嗅覚です"}, {"q": "「ちりん」はどんな表現？", "opts": ["比喩", "擬音語", "反対語", "倒置"], "ans": 1, "exp": "音をまねた擬音語です"}, {"q": "具体的な情景を伝える表現は？", "opts": ["楽しい夏", "きれいな日", "水しぶき光るプール", "気分がよい"], "ans": 2, "exp": "見える景色を具体的に描いています"}, {"q": "俳句の推敲で効果的なのは？", "opts": ["感情語を増やす", "具体的な出来事を入れる", "季語を全部消す", "必ず30音にする"], "ans": 1, "exp": "具体的な描写で情景が伝わります"}, {"q": "「季重なり」の例は？", "opts": ["桜咲く 春風わたる", "夕焼けに 自転車走る", "雪の朝 静かな庭", "秋の空 雲がのびる"], "ans": 0, "exp": "桜と春風がどちらも春の季語です"}, {"q": "五・七・五で季語が一つの句は？", "opts": ["春風や ぼうしがとんで 追いかける", "春風や ぼうしを追って 坂を行く", "夏休み 蝉鳴く庭で 昼寝する", "雪の朝 白い雪降る 町の中"], "ans": 1, "exp": "はるかぜや5・ぼうしをおって7・さかをゆく5です"}, {"q": "「まるでわたあめ」の表現は？", "opts": ["倒置", "直喩", "擬人法", "反復"], "ans": 1, "exp": "まるでを用いた直喩です"}, {"q": "「山笑う」が表すのは？", "opts": ["春の明るい山", "山の笑い声", "夏の祭り", "冬の雪山"], "ans": 0, "exp": "春の山の生き生きした様子です"}, {"q": "「虫の声」の季節は？", "opts": ["春", "夏", "秋", "冬"], "ans": 2, "exp": "秋の季語です"}, {"q": "「切れ字」の主な効果は？", "opts": ["音数を減らす", "区切りと余韻を生む", "季語を消す", "作者名を示す"], "ans": 1, "exp": "切れ字は句に区切りと余韻を生みます"}];let A=Array(50).fill(null),i=0;try{let s=JSON.parse(localStorage.getItem('haiku50'));if(s&&s.length===50)A=s}catch(e){}function save(){localStorage.setItem('haiku50',JSON.stringify(A))}function start(){document.getElementById('intro').classList.add('hidden');document.getElementById('exam').classList.remove('hidden');render()}function move(n){i=Math.max(0,Math.min(49,i+n));render();scrollTo(0,0)}function render(){let q=Q[i];document.getElementById('count').textContent='第'+(i+1)+'問 / 50';document.getElementById('progress').textContent='　回答済み '+A.filter(x=>x!==null).length+'問';document.getElementById('question').textContent=q.q;let opts=document.getElementById('opts');opts.replaceChildren();q.opts.forEach((t,j)=>{let b=document.createElement('button');b.className='opt'+(A[i]===j?' sel':'');b.textContent='アイウエ'[j]+'　'+t;b.onclick=()=>{A[i]=j;save();render()};opts.append(b)});document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===49;let g=document.getElementById('grid');g.replaceChildren();Q.forEach((_,j)=>{let b=document.createElement('button');b.className='num'+(A[j]!==null?' done':'');b.textContent=j+1;b.onclick=()=>{i=j;render();scrollTo(0,0)};g.append(b)})}function finish(){let missing=A.filter(x=>x===null).length;if(missing&&!confirm('未回答が'+missing+'問あります。採点しますか？'))return;document.getElementById('exam').classList.add('hidden');document.getElementById('result').classList.remove('hidden');let n=Q.filter((q,j)=>q.ans===A[j]).length;document.getElementById('score').textContent=n*2+' / 100点';document.getElementById('detail').textContent='正解 '+n+'問 / 50問';let r=document.getElementById('reviews');r.replaceChildren();Q.forEach((q,j)=>{let d=document.createElement('div');d.className='review';let p=document.createElement('p');p.textContent=(j+1)+'. '+q.q;let a=document.createElement('p');a.className=A[j]===q.ans?'good':'bad';a.textContent=(A[j]===q.ans?'正解':'不正解')+'｜あなた：'+(A[j]===null?'未回答':q.opts[A[j]])+'｜正解：'+q.opts[q.ans];let e=document.createElement('p');e.textContent='解説：'+q.exp;d.append(p,a,e);r.append(d)});scrollTo(0,0)}function reset(){if(!confirm('全回答を消してやり直しますか？'))return;A=Array(50).fill(null);i=0;save();document.getElementById('result').classList.add('hidden');start()}</script></html>
